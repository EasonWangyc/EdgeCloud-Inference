<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 500" role="img" aria-labelledby="title desc">
  <title id="title">Parking risk inference and study data flow</title>
  <desc id="desc">Images and annotations become ParkingCase objects. A frozen workload drives RiskRuntime through Transformers, vLLM, or TensorRT Edge-LLM. InferenceRecord stores the assessment or failure, and StudyRunner creates a StudyReport.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1160" height="500" rx="22" fill="#f8fafc"/>
  <text x="40" y="52" fill="#0f172a" font-family="Arial, sans-serif" font-size="28" font-weight="700">推理与评测数据流</text>
  <text x="40" y="77" fill="#475569" font-family="Arial, sans-serif" font-size="14">同一任务契约 · 三种运行时适配 · 可追溯的实验记录</text>

  <path d="M230 160 H260 V212 H285" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M230 304 H260 V248 H285" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M495 230 H520 V139 H545" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M495 230 H545" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M495 230 H520 V321 H545" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M785 139 H819 V205 H850" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M785 230 H850" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M785 321 H819 V255 H850" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M980 291 V355" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="40" y="116" width="190" height="88" rx="15" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text x="58" y="148" fill="#14532d" font-family="Arial, sans-serif" font-size="18" font-weight="700">ParkingCase</text>
  <text x="58" y="177" fill="#334155" font-family="Arial, sans-serif" font-size="14">图片 · 来源组 · 标注</text>

  <rect x="40" y="260" width="190" height="88" rx="15" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"/>
  <text x="58" y="292" fill="#5b21b6" font-family="Arial, sans-serif" font-size="18" font-weight="700">FrozenWorkload</text>
  <text x="58" y="321" fill="#334155" font-family="Arial, sans-serif" font-size="14">提示词 · 尺寸 · JSON</text>

  <rect x="285" y="175" width="210" height="110" rx="15" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <text x="305" y="214" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="20" font-weight="700">RiskRuntime</text>
  <text x="305" y="244" fill="#334155" font-family="Arial, sans-serif" font-size="14">Adapter 选择 · 端云路由</text>

  <rect x="545" y="101" width="240" height="76" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="562" y="132" fill="#0f172a" font-family="Arial, sans-serif" font-size="18" font-weight="700">Transformers</text>
  <text x="562" y="157" fill="#475569" font-family="Arial, sans-serif" font-size="14">正确性参考 · Jetson FP16</text>

  <rect x="545" y="192" width="240" height="76" rx="15" fill="#ffffff" stroke="#7dd3fc" stroke-width="2"/>
  <text x="562" y="223" fill="#075985" font-family="Arial, sans-serif" font-size="18" font-weight="700">vLLM HTTP</text>
  <text x="562" y="248" fill="#475569" font-family="Arial, sans-serif" font-size="14">WSL / 云侧 GPU</text>

  <rect x="545" y="283" width="240" height="76" rx="15" fill="#ffffff" stroke="#bef264" stroke-width="2"/>
  <text x="562" y="314" fill="#365314" font-family="Arial, sans-serif" font-size="18" font-weight="700">TensorRT Edge-LLM</text>
  <text x="562" y="339" fill="#475569" font-family="Arial, sans-serif" font-size="14">Jetson FP16 / INT4</text>

  <rect x="850" y="169" width="260" height="122" rx="15" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
  <text x="870" y="207" fill="#78350f" font-family="Arial, sans-serif" font-size="20" font-weight="700">InferenceRecord</text>
  <text x="870" y="238" fill="#334155" font-family="Arial, sans-serif" font-size="14">ParkingAssessment 或失败原因</text>
  <text x="870" y="264" fill="#334155" font-family="Arial, sans-serif" font-size="14">时延 · 运行时身份</text>

  <rect x="850" y="355" width="260" height="102" rx="15" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="2"/>
  <text x="870" y="391" fill="#312e81" font-family="Arial, sans-serif" font-size="20" font-weight="700">StudyRunner</text>
  <text x="870" y="423" fill="#334155" font-family="Arial, sans-serif" font-size="16">质量 + 性能 → StudyReport</text>
</svg>
